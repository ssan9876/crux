<!doctype html>
<!-- Source for og.png (the link-preview image). Regenerate with: python tools/make_og_image.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 72px 84px;
    background: #2b45e0;
    color: #eef1f7;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: "Atkinson Hyperlegible", sans-serif;
  }
  .mark { font: 800 168px/0.9 "Bricolage Grotesque", sans-serif; letter-spacing: -0.04em; margin: 0; }
  .line { font-size: 40px; line-height: 1.25; margin: 20px 0 0; max-width: 820px; }
  .tiles { display: flex; gap: 14px; }
  .tile {
    width: 96px; height: 110px; border-radius: 12px;
    display: grid; place-items: center;
    font: 800 60px/1 "Bricolage Grotesque", sans-serif;
    color: #1b2340; background: #ffd23f;
  }
  .tile.empty { background: transparent; border: 4px solid rgb(238 241 247 / 0.45); box-sizing: border-box; }
</style>
</head>
<body>
  <div>
    <h1 class="mark">Crux</h1>
    <p class="line">A new question every day. The answer is always one word.</p>
  </div>
  <div class="tiles">
    <span class="tile">O</span><span class="tile empty"></span><span class="tile">E</span><span class="tile empty"></span><span class="tile empty"></span><span class="tile">R</span><span class="tile empty"></span>
  </div>
</body>
</html>
